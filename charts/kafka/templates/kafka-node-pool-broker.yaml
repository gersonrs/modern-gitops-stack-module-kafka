---
{{- if .Values.kafka.kraft }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.kafka.name }}-node-pool
  labels:
    {{- include "modern-gitops-stack-module-kafka.labels" $ | indent 4 }}
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.kraft.storage.size }}
        kraftMetadata: shared
        deleteClaim: false
  {{- with .Values.kafka.resources.kafka }}
  resources:
    {{- with .requests }}
    requests:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .limits }}
    limits:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
